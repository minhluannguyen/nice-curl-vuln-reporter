# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

# GitLab CI Cache with Nix is based on https://gitlab.com/Cynerd/gitlab-ci-nix

.nix:
  image: nixos/nix
  variables:
    RUNNER_AFTER_SCRIPT_TIMEOUT: 30m
  cache:
    key: "nix"
    paths:
      - ".nix-cache"
  before_script:
    - echo "experimental-features = nix-command flakes" >>/etc/nix/nix.conf
    - cachedir="$(pwd)/.nix-cache"
    - |
      if [ -d "$cachedir" ]; then echo "extra-substituters = file://$cachedir?priority=10&trusted=true" \ >>/etc/nix/nix.conf
      fi
    - find /nix/store -mindepth 1 -maxdepth 1 ! -name \*.drv | sort >/nix/.before
  after_script:
    - echo 'Assemble list of new builds'
    - find /nix/store -mindepth 1 -maxdepth 1 ! -name \*.drv | sort >/nix/.after
    - comm -13 /nix/.before /nix/.after >/nix/.new
    - if ! [ -s /nix/.new ]; then exit 0; fi
    - echo 'Export new builds to Gitlab CI Runner cache'
    - |
      if [ -z "${NO_NIX_CACHE:-}" ]; then
        xargs -a /nix/.new nix copy --to "file://$(pwd)/.nix-cache"
      fi

stages:
  - test

# TESTING STAGE
#===================================================================================================================

test-all-reports:
  extends: .nix 
  stage: test
  script:
    - |-
      set -e
      BASE_DIR="reports"
      FAILED=0

      for dir in "$BASE_DIR"/*/; do
        if [ -d "$dir" ]; then
          echo "Running test in $dir"
          (
            cd "$dir"
            nix run --refresh .#testVulnerableTrue.driver
          )

          if [ $? -ne 0 ]; then
            echo "Failed: $dir"
            FAILED=1
          fi
        fi
      done

      exit $FAILED
